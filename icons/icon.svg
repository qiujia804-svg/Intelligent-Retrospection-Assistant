<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg-gradient)"/>

  <!-- Chart icon -->
  <g fill="white">
    <!-- Bar chart bars -->
    <rect x="100" y="280" width="60" height="120" rx="10"/>
    <rect x="180" y="220" width="60" height="180" rx="10"/>
    <rect x="260" y="160" width="60" height="240" rx="10"/>
    <rect x="340" y="120" width="60" height="280" rx="10"/>

    <!-- Trend line -->
    <path d="M80 350 L160 280 L240 220 L320 160 L400 100"
          stroke="white" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Trend arrow -->
    <polygon points="400,80 430,110 400,120 390,100" fill="white" opacity="0.8"/>
  </g>
</svg>
