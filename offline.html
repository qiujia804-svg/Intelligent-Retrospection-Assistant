<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>离线 - 智能复盘助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .offline-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .offline-message {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .offline-tip {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .offline-tip h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        .offline-tip p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .retry-btn:active {
            transform: scale(0.98);
        }

        .retry-btn:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .cached-data-notice {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .cached-data-notice a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">暂时无法连接</h1>
        <p class="offline-message">
            网络连接似乎出了点问题，<br>
            请检查您的网络设置后重试。
        </p>

        <div class="offline-tip">
            <h4>💡 小贴士</h4>
            <p>您之前保存的复盘数据仍然安全保存在本地，联网后即可正常使用和同步。</p>
        </div>

        <button class="retry-btn" onclick="location.reload()">
            重新连接
        </button>

        <p class="cached-data-notice">
            您可以尝试 <a href="javascript:history.back()">返回上一页</a> 查看缓存内容
        </p>
    </div>

    <script>
        // 监听网络状态变化
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
