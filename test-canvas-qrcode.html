<!DOCTYPE html>
<html>
<head>
    <title>Canvas QR Code Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .qrcode-container {
            display: inline-block;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 {
            margin-bottom: 10px;
        }
        canvas {
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h1>Canvas QR Code Test</h1>
    
    <div class="qrcode-container">
        <h2>微信收款码</h2>
        <div id="wechat-qrcode-canvas"></div>
        <p>扫描此二维码测试微信支付</p>
    </div>
    
    <div class="qrcode-container">
        <h2>支付宝收款码</h2>
        <div id="alipay-qrcode-canvas"></div>
        <p>扫描此二维码测试支付宝支付</p>
    </div>
    
    <script>
        // 使用QRCode.js库生成二维码
        // 微信支付示例链接 (实际应用中需要替换为真实的微信支付链接)
        new QRCode(document.getElementById("wechat-qrcode-canvas"), {
            text: "weixin://wxpay/bizpayurl?pr=example123",
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
        
        // 支付宝支付示例链接 (实际应用中需要替换为真实的支付宝支付链接)
        new QRCode(document.getElementById("alipay-qrcode-canvas"), {
            text: "alipays://platformapi/startapp?appId=20000067&url=example.com",
            width: 200,
            height: 200,
            colorDark : "#00A0E9",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
