<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付模态框测试</title>
    <style>
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            position: relative;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        
        .close:hover, .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        
        /* 收款码样式 */
        .qrcode-placeholder {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .qrcode-placeholder img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .subscribe-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .test-btn {
            background-color: #008CBA;
            color: white;
        }
    </style>
</head>
<body>
    <h1>支付模态框测试</h1>
    
    <button id="test-plan-btn" class="btn test-btn">测试年度会员订阅</button>
    <button id="open-modal-btn" class="btn subscribe-btn">直接打开支付模态框</button>
    
    <!-- 支付确认模态框 -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>支付确认</h2>
            <div class="payment-info">
                <p id="payment-plan-name">订阅计划：年度会员</p>
                <p id="payment-amount">支付金额：¥199/年</p>
                <div class="payment-qrcode">
                    <h3>微信收款码</h3>
                    <div id="wechat-qrcode" class="qrcode-placeholder">
                        <img src="images/wechat-qrcode.svg" alt="微信收款码" style="width: 200px; height: 200px; object-fit: contain;">
                    </div>
                    <h3>支付宝收款码</h3>
                    <div id="alipay-qrcode" class="qrcode-placeholder">
                        <img src="images/alipay-qrcode.svg" alt="支付宝收款码" style="width: 200px; height: 200px; object-fit: contain;">
                    </div>
                </div>
                <div class="payment-instructions">
                    <p>请扫描上方任意收款码完成支付，支付后请点击下方按钮确认。</p>
                </div>
                <div class="payment-actions">
                    <button id="payment-confirm" class="btn subscribe-btn">确认支付完成</button>
                    <button id="payment-cancel" class="btn test-btn">取消支付</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 模拟数据
        const testPlan = {
            name: '年度会员',
            price: 199,
            period: '年'
        };
        
        // 获取DOM元素
        const paymentModal = document.getElementById('payment-modal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const testPlanBtn = document.getElementById('test-plan-btn');
        const closeBtn = document.querySelector('#payment-modal .close');
        const paymentConfirmBtn = document.getElementById('payment-confirm');
        const paymentCancelBtn = document.getElementById('payment-cancel');
        const paymentPlanNameElement = document.getElementById('payment-plan-name');
        const paymentAmountElement = document.getElementById('payment-amount');
        const wechatQRCodeElement = document.getElementById('wechat-qrcode');
        const alipayQRCodeElement = document.getElementById('alipay-qrcode');
        
        // 打开模态框
        function openModal(modal) {
            modal.style.display = 'block';
            console.log('模态框已打开');
            console.log('微信收款码元素:', wechatQRCodeElement.innerHTML);
            console.log('支付宝收款码元素:', alipayQRCodeElement.innerHTML);
        }
        
        // 关闭模态框
        function closeModal(modal) {
            modal.style.display = 'none';
            console.log('模态框已关闭');
        }
        
        // 设置支付计划
        function setPaymentPlan(plan) {
            paymentPlanNameElement.textContent = `订阅计划：${plan.name}`;
            paymentAmountElement.textContent = `支付金额：¥${plan.price}/${plan.period}`;
            console.log('支付计划已设置:', plan);
        }
        
        // 事件监听器
        openModalBtn.addEventListener('click', () => openModal(paymentModal));
        
        testPlanBtn.addEventListener('click', () => {
            setPaymentPlan(testPlan);
            openModal(paymentModal);
        });
        
        closeBtn.addEventListener('click', () => closeModal(paymentModal));
        
        paymentConfirmBtn.addEventListener('click', () => {
            alert('支付确认功能已触发');
            closeModal(paymentModal);
        });
        
        paymentCancelBtn.addEventListener('click', () => closeModal(paymentModal));
        
        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeModal(e.target);
            }
        });
        
        // 页面加载完成后检查图片
        window.addEventListener('load', () => {
            console.log('页面加载完成');
            
            // 检查图片是否可以正常加载
            const testImages = [
                'images/wechat-qrcode.svg',
                'images/alipay-qrcode.svg'
            ];
            
            testImages.forEach((src, index) => {
                const img = new Image();
                img.onload = function() {
                    console.log(`图片加载成功 [${index}]:`, src);
                };
                img.onerror = function() {
                    console.error(`图片加载失败 [${index}]:`, src);
                };
                img.src = src;
            });
        });
    </script>
</body>
</html>
