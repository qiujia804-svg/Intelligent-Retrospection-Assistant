        // 提取12月份的数据
        function extractDecemberData() {
            const decemberReviews = jsonData.reviews.filter(review => 
                review.date.startsWith('2025-12')
            );
            
            console.log('12月份复盘记录数:', decemberReviews.length);
            
            // 提取时间分配数据
            const timeData = {};
            
            decemberReviews.forEach(review => {
                const strengths = review.strengths || '';
                
                // 匹配格式：项目名/时长分钟/百分比% 或 项目名/时长分钟
                const timePattern = /([^\/\n]+)\/(\d+)分钟\/?(\d+)?%?/g;
                let match;
                
                while ((match = timePattern.exec(strengths)) !== null) {
                    const project = match[1].trim();
                    const minutes = parseInt(match[2], 10);
                    
                    if (project && !isNaN(minutes) && minutes > 0) {
                        if (!timeData[project]) {
                            timeData[project] = 0;
                        }
                        timeData[project] += minutes;
                    }
                }
                
                // 匹配学习总时长
                const totalPattern = /学习总时长：(\d+)分钟/;
                const totalMatch = strengths.match(totalPattern);
                if (totalMatch) {
                    const totalMinutes = parseInt(totalMatch[1], 10);
                    if (!isNaN(totalMinutes)) {
                        if (!timeData['总学习时长']) {
                            timeData['总学习时长'] = 0;
                        }
                        timeData['总学习时长'] += totalMinutes;
                    }
                }
            });
            
            console.log('提取的时间数据:', timeData);
            return timeData;
        }

        // 生成图表数据
        function generateChartData() {
            const timeData = extractDecemberData();
            
            // 移除总学习时长，只保留具体项目
            const { '总学习时长': totalStudyHours, ...projectData } = timeData;
            
            // 转换为图表所需格式
            const categories = Object.keys(projectData);
            const values = Object.values(projectData);
            
            // 计算总时长（小时）
            const totalMinutes = values.reduce((sum, val) => sum + val, 0);
            const totalHours = (totalMinutes / 60).toFixed(1);
            
            // 生成雷达图指标
            const radarIndicator = categories.map(name => ({
                name: name,
                max: Math.max(...values) * 1.2
            }));
            
            // 生成柱状图数据
            const barData = categories.map((name, index) => ({
                name: name,
                value: values[index],
                hours: `${Math.floor(values[index] / 60)}h${values[index] % 60}m`
            })).sort((a, b) => b.value - a.value);
            
            return {
                radar: {
                    indicator: radarIndicator,
                    data: values
                },
                bar: barData,
                totalHours: totalHours,
                totalDays: jsonData.reviews.filter(review => 
                    review.date.startsWith('2025-12')
                ).length,
                projectData: projectData
            };
        }

                        return `${params.name}<br/>投入时间: ${timeStr}`;

        // 初始化柱状图
        function initBarChart(data) {

                        rotate: data.length > 4 ? 30 : 0
                    },
                    axisLine: {

                            color: 'rgba(255, 255, 255, 0.3)'
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        color: 'rgba(255, 255, 255, 0.6)',
                        fontSize: 10,
                        formatter: function(value) {
                            return Math.floor(value / 60) + 'h';
                        }
                    },
                    axisLine: {
                        show: false
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    }
                },
                series: [{
                    type: 'bar',
                    data: data.map(item => ({
                        value: item.value,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#1890ff' },
                                { offset: 1, color: '#1890ff80' }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        }
                    })),
                    barWidth: '60%',
                    label: {
                        show: true,
                        position: 'top',
                        color: 'rgba(255, 255, 255, 0.9)',
                        fontSize: 10,
                        formatter: function(params) {
                            const hours = Math.floor(params.value / 60);
                            const mins = params.value % 60;
                            if (hours > 0) {
                                return mins > 0 ? `${hours}h${mins}m` : `${hours}h`;
                            }
                            return `${mins}m`;
                        }
                    }
                }]
            };
            
            barChart.setOption(option);
        }

        // 显示数据摘要
        function showDataSummary(chartData) {
            const summaryDiv = document.getElementById('data-summary');
            let html = '';
            
            html += `<div class="data-item"><strong>本月总投入:</strong> ${chartData.totalHours}小时</div>`;
            html += `<div class="data-item"><strong>复盘天数:</strong> ${chartData.totalDays}天</div>`;
            html += `<div class="data-item"><strong>项目明细:</strong></div>`;
            
            for (const [project, minutes] of Object.entries(chartData.projectData)) {
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                const timeStr = hours > 0 ? `${hours}h${mins > 0 ? mins + 'm' : ''}` : `${mins}m`;
                html += `<div class="data-item" style="margin-left: 20px;">${project}: ${timeStr}</div>`;
            }
            
            summaryDiv.innerHTML = html;
        }

        // 初始化图表
        function initCharts() {
            const chartData = generateChartData();
            
            initRadarChart(chartData.radar);
            initBarChart(chartData.bar);
            showDataSummary(chartData);
            
            // 监听窗口大小变化
            window.addEventListener('resize', function() {
                echarts.getInstanceByDom(document.getElementById('radar-chart')).resize();
                echarts.getInstanceByDom(document.getElementById('bar-chart')).resize();
            });
        }

        // 页面加载完成后初始化图表
        document.addEventListener('DOMContentLoaded', initCharts);
