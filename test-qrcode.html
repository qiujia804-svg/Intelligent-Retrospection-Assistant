<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片路径测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        img { border: 1px solid #ccc; }
        .modal { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 5px; width: 50%; }
        .qrcode-placeholder { width: 200px; height: 200px; margin: 0 auto 20px; background-color: #f0f0f0; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; border-radius: 5px; overflow: hidden; }
        .qrcode-placeholder img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <h1>图片路径测试</h1>
    
    <!-- 直接访问图片 -->
    <div class="test-section">
        <h2>直接访问图片</h2>
        <img src="images/wechat-qrcode.svg" alt="微信收款码" style="width: 200px; height: 200px; object-fit: contain;">
        <img src="images/alipay-qrcode.svg" alt="支付宝收款码" style="width: 200px; height: 200px; object-fit: contain;">
    </div>
    
    <!-- 模拟模态框 -->
    <div class="test-section">
        <h2>模拟支付模态框</h2>
        <div class="modal">
            <div class="modal-content">
                <h3>支付确认</h3>
                <div class="payment-qrcode">
                    <h4>微信收款码</h4>
                    <div id="test-wechat-qrcode" class="qrcode-placeholder">
                            <img src="images/wechat-qrcode.svg" alt="微信收款码" style="width: 200px; height: 200px; object-fit: contain;">
                        </div>
                        <h4>支付宝收款码</h4>
                        <div id="test-alipay-qrcode" class="qrcode-placeholder">
                            <img src="images/alipay-qrcode.svg" alt="支付宝收款码" style="width: 200px; height: 200px; object-fit: contain;">
                        </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 模拟JavaScript动态设置 -->
    <div class="test-section">
        <h2>JavaScript动态设置</h2>
        <div id="js-wechat-qrcode" class="qrcode-placeholder"></div>
        <div id="js-alipay-qrcode" class="qrcode-placeholder"></div>
        <button onclick="setQRCodeImages()">设置二维码</button>
    </div>
    
    <script>
        // 模拟动态设置二维码
        function setQRCodeImages() {
            const wechatQRCodePath = 'images/wechat-qrcode.svg';
            const alipayQRCodePath = 'images/alipay-qrcode.svg';
            
            const wechatElement = document.getElementById('js-wechat-qrcode');
            const alipayElement = document.getElementById('js-alipay-qrcode');
            
            if (wechatElement) {
                wechatElement.innerHTML = `<img src="${wechatQRCodePath}" alt="微信收款码" style="width: 200px; height: 200px; object-fit: contain;">`;
                console.log('微信收款码已设置:', wechatElement.innerHTML);
            }
            
            if (alipayElement) {
                alipayElement.innerHTML = `<img src="${alipayQRCodePath}" alt="支付宝收款码" style="width: 200px; height: 200px; object-fit: contain;">`;
                console.log('支付宝收款码已设置:', alipayElement.innerHTML);
            }
        }
        
        // 页面加载时检查图片路径
        window.onload = function() {
            console.log('页面加载完成');
            
            // 检查图片是否可以正常加载
        const testImages = [
            'images/wechat-qrcode.svg',
            'images/alipay-qrcode.svg'
        ];
            
            testImages.forEach((src, index) => {
                const img = new Image();
                img.onload = function() {
                    console.log(`图片加载成功 [${index}]:`, src);
                };
                img.onerror = function() {
                    console.error(`图片加载失败 [${index}]:`, src);
                };
                img.src = src;
            });
        };
    </script>
</body>
</html>
